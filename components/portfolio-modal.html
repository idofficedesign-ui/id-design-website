<!-- Portfolio Modal -->

<div
  id="portfolio-modal"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center px-6 py-10 overflow-y-auto"
>

  <div class="bg-white max-w-md w-full rounded-[32px] p-8 relative">

    <!-- Close Button -->

    <button
      id="close-modal"
      class="absolute top-6 right-8 text-3xl text-gray-400 hover:text-black"
    >
      ×
    </button>

    <p class="uppercase tracking-[0.3em] text-sm text-[#14532D] mb-6">
      Access Portfolio
    </p>

    <h2 class="text-2xl md:text-3xl leading-tight font-light text-[#111827] mb-8">
      Explore Our
      Complete Interior
      Portfolio
    </h2>

    <p class="text-gray-500 leading-relaxed mb-8">
      Leave your information below to access our
      curated workspace and commercial interior projects.
    </p>

    <!-- Form -->

    <form class="flex flex-col gap-5">

      <input
        type="text"
        placeholder="Your Name"
        class="border border-gray-200 px-6 py-5 rounded-2xl outline-none focus:border-[#14532D]"
      />

      <input
        type="text"
        placeholder="Company Name"
        class="border border-gray-200 px-6 py-5 rounded-2xl outline-none focus:border-[#14532D]"
      />

      <input
        type="text"
        placeholder="WhatsApp Number"
        class="border border-gray-200 px-6 py-5 rounded-2xl outline-none focus:border-[#14532D]"
      />

      <button
        class="bg-[#14532D] text-white py-5 rounded-2xl hover:opacity-90 transition"
      >
        Access Portfolio
      </button>

    </form>

  </div>

</div>
